<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1611">
<title>抄经 · 静心</title>
<link rel="stylesheet" href="styles.css?v=32">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@600&display=swap">
</head>
<body>
<div id="app">

  <!-- 1. 推荐码进入页 -->
  <section id="screen-invite" class="screen">
    <div class="invite-card">
      <div class="invite-seal">🪷</div>
      <h1>抄经</h1>
      <p class="subtitle">一笔一划 · 安心静虑</p>
      <input id="invite-code" type="text" placeholder="请输入推荐码" autocomplete="off" autocapitalize="characters">
      <button id="btn-verify" class="btn-primary">进入</button>
      <p id="invite-msg" class="msg"></p>
    </div>
  </section>

  <!-- 2. 注册 / 登录 -->
  <section id="screen-auth" class="screen">
    <div class="invite-card">
      <div class="invite-seal">🪷</div>
      <h1 id="auth-title">注册</h1>
      <p class="invite-sub" id="auth-sub">推荐码验证通过，请注册账号</p>
      <div class="filter-row" style="justify-content:center">
        <button class="chip active" id="chip-mode-register">注册</button>
        <button class="chip" id="chip-mode-login">登录</button>
      </div>
      <div class="filter-row" style="justify-content:center;margin-top:8px">
        <button class="chip active" id="chip-type-phone">手机</button>
        <button class="chip" id="chip-type-email">邮箱</button>
      </div>
      <input id="auth-account" class="invite-input" placeholder="手机号" inputmode="tel" autocomplete="tel">
      <div id="auth-code-row" class="code-row">
        <input id="auth-code" class="invite-input" placeholder="验证码" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
        <button id="btn-auth-send-code">发送验证码</button>
      </div>
      <input id="auth-password" class="invite-input" type="password" placeholder="密码（至少 6 位）" autocomplete="current-password">
      <button id="btn-auth-submit" class="btn-primary">注册</button>
      <p id="auth-msg" class="msg"></p>
      <button id="btn-auth-reinvite" class="btn-ghost">重新输入推荐码</button>
    </div>
  </section>

  <!-- 3. 经文库列表 -->
  <section id="screen-library" class="screen active">
    <div class="filter-row">
      <button class="chip active" data-trad="all">全部</button>
      <button class="chip" data-trad="buddhist">佛经</button>
      <button class="chip" data-trad="taoist">道经</button>
    </div>
    <ul id="sutra-list" class="sutra-list"></ul>

    <h3 class="sec-title" id="my-works-title" style="display:none">我的抄经</h3>
    <div id="my-works" class="work-cards"></div>

    <h3 class="sec-title">大家的抄经</h3>
    <div id="public-works" class="work-cards"></div>
    <div class="foot-spacer"></div>
  </section>

  <!-- 4. 全屏抄写 -->
  <section id="screen-write" class="screen">
    <canvas id="paper-canvas"></canvas>
    <canvas id="ink-canvas"></canvas>

    <!-- 开场：经名 2 秒 / 段落慢读高亮 -->
    <div id="intro-overlay" class="hidden">
      <div id="intro-title"></div>
      <div id="intro-para"></div>
    </div>

    <!-- 选笔（首次） -->
    <!-- 换字体（工具内） -->
    <div id="font-overlay" class="picker-overlay hidden">
      <div class="picker-card">
        <h3>选择字体</h3>
        <div id="font-cards-2" class="pick-cards"></div>
        <button id="btn-font-done" class="btn-primary btn-big">确定</button>
      </div>
    </div>

    <!-- 左下角：工具 + 橡皮 -->
    <div id="write-ui">
      <button id="btn-tools" class="fab" aria-label="工具">☰</button>
      <button id="btn-eraser" class="fab" aria-label="橡皮擦">🧽</button>
    </div>

    <!-- 工具菜单：散布全屏 -->
    <div id="tools-menu" class="tools-menu hidden">
      <button class="tool-item" data-tool="sutra">经文</button>
      <button class="tool-item" data-tool="font">字体</button>
      <button class="tool-item" data-tool="music">背景音</button>
      <button class="tool-item" data-tool="view">欣赏</button>
      <button class="tool-item" data-tool="share">分享</button>
    </div>

    <!-- 写完一字的过渡按钮 -->
    <button id="btn-keep-editing" class="pill hidden">继续改写</button>
    <button id="btn-force-next" class="pill hidden">写好了 →</button>

    <!-- 全部写完 -->
    <div id="done-overlay" class="picker-overlay hidden">
      <div class="picker-card" id="done-main">
        <div class="done-seal">🪷</div>
        <h3>全部写完</h3>
        <p id="done-summary" class="picker-hint"></p>
        <div id="done-farewell" class="farewell-block">
          <p class="farewell-title">此作何去</p>
          <div id="farewell-modes" class="farewell-row"></div>
          <div id="farewell-days-row" class="farewell-row hidden">
            <button class="chip" data-days="0">即刻</button>
            <button class="chip" data-days="1">1 日后</button>
            <button class="chip" data-days="3">3 日后</button>
            <button class="chip active" data-days="7">7 日后</button>
          </div>
          <p id="farewell-note" class="picker-hint"></p>
        </div>
      </div>
      <div class="picker-card hidden" id="done-cremated">
        <div class="done-seal">🪷</div>
        <h3>尘归尘 · 功德圆满</h3>
        <p class="picker-hint">此作已焚化，形化去，功德留存。</p>
      </div>
    </div>
  </section>

  <!-- 5. 欣赏作品：只有纸，没有标题和按钮（标题写进纸里） -->
  <section id="screen-appreciate" class="screen">
    <div id="appreciate-dual"></div>
    <div class="foot-spacer"></div>
  </section>

  <!-- 5b. 回向记录：一部经的全部回向（公开与个人） -->
  <section id="screen-dedications" class="screen">
    <h3 id="ded-wall-title" class="sec-title">回向记录</h3>
    <div id="ded-wall" class="ded-wall"></div>
    <div class="foot-spacer"></div>
  </section>

  <!-- 6. 作品查看：只有纸（标题写进纸里）；回向文保留展示；录音只供放映播放 -->
  <section id="screen-work" class="screen">
    <div id="dedication-block" class="dedication-block hidden">
      <div class="dedication-label">🪷 回向文</div>
      <p id="dedication-text" class="dedication-text"></p>
      <p id="dedication-meta" class="picker-hint"></p>
    </div>
    <audio id="workview-audio" style="display:none"></audio>
    <div id="workview-dual"></div>
    <div class="foot-spacer"></div>
  </section>

</div>

<!-- 全局工具按钮：各屏功能按钮收拢于此（书写屏用自己的工具菜单） -->
<button id="global-tools" class="fab" style="display:none" aria-label="工具">☰</button>
<div id="global-menu" class="tools-menu hidden"></div>

<!-- 回放弹窗：重演一字的落笔过程 -->
<div id="replay-overlay" class="picker-overlay hidden">
  <div class="picker-card replay-card">
    <h3 id="replay-label"></h3>
    <div class="replay-stage">
      <canvas id="replay-paper"></canvas>
      <canvas id="replay-ink"></canvas>
    </div>
    <div class="done-actions">
      <button id="btn-replay-again" class="btn-secondary">再播一次</button>
      <button id="btn-replay-close" class="btn-primary">关闭</button>
    </div>
  </div>
</div>

<!-- 落笔放映：整部作品按原节奏依次重演，如有人在眼前落笔 -->
<div id="inkplay-overlay" class="picker-overlay hidden">
  <div class="picker-card inkplay-card">
    <h3>落笔放映</h3>
    <div class="inkplay-stage" id="inkplay-stage">
      <canvas id="inkplay-paper"></canvas>
      <canvas id="inkplay-ink"></canvas>
    </div>
    <div class="inkplay-bar">
      <span id="inkplay-label"></span>
      <button id="btn-inkplay-close" class="btn-ghost">关闭</button>
    </div>
  </div>
</div>

<!-- 回向对话框 -->
<div id="dedicate-overlay" class="picker-overlay hidden">
  <div class="picker-card dedicate-card">
    <h3>🪷 回向</h3>
    <p class="picker-hint">字迹将化烟而去，唯留尘埃与回向文。此后不可再欣赏、续写，请郑重。</p>
    <label class="dedicate-label2" for="dedicate-target">回向对象</label>
    <input id="dedicate-target" class="text-input" maxlength="40" placeholder="法界一切众生">
    <div class="dedicate-label2">回向文</div>
    <div id="dedicate-kinds" class="dedicate-kinds">
      <button data-kind="huixiangji" class="chip">回向偈</button>
      <button data-kind="puxian" class="chip">普贤回向</button>
      <button data-kind="pingdeng" class="chip">平等回向</button>
      <button data-kind="xiaozai" class="chip">消灾祈福</button>
    </div>
    <p id="dedicate-preview" class="dedicate-preview"></p>
    <div class="dedicate-label2">回向署名</div>
    <div id="dedicate-names" class="dedicate-kinds">
      <button data-anon="1" class="chip active">匿名</button>
      <button data-anon="0" class="chip">署名</button>
    </div>
    <input id="dedicate-sign" class="text-input hidden" maxlength="20" placeholder="署名，如：妙音居士">
    <div class="inkplay-bar">
      <button id="btn-dedicate-confirm" class="btn-primary">开始回向</button>
      <button id="btn-dedicate-cancel" class="btn-ghost">取消</button>
    </div>
  </div>
</div>

<!-- 回向仪式：读文 + 化烟 -->
<div id="ceremony-overlay" class="hidden">
  <div class="ceremony-veil"></div>
  <div class="ceremony-banner" id="ceremony-banner">
    <div class="ceremony-title-row">
      <div class="dedication-label">🪷 回向文</div>
      <button id="ceremony-fold" class="btn-ghost">收起 ↑</button>
    </div>
    <div id="ceremony-text" class="ceremony-text"></div>
    <div class="ceremony-progress"><i id="ceremony-progress-i"></i></div>
    <div id="ceremony-status" class="ceremony-status">字迹化烟中……</div>
  </div>
  <div id="ceremony-stage"></div>
</div>

<!-- 打印专用：屏幕上隐藏，打印时显示 -->
<div id="print-sheet"></div>

<script src="music.js?v=29"></script>
<script src="writing.js?v=29"></script>
<script src="app.js?v=33"></script>
</body>
</html>
