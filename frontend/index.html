<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1611">
<title>抄经 · 静心</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@600&display=swap">
</head>
<body>
<div id="app">

  <!-- 1. 推荐码进入页 -->
  <section id="screen-invite" class="screen active">
    <div class="invite-card">
      <div class="invite-seal">🪷</div>
      <h1>抄经</h1>
      <p class="subtitle">一笔一划 · 安心静虑</p>
      <input id="invite-code" type="text" placeholder="请输入推荐码" autocomplete="off" autocapitalize="characters">
      <button id="btn-verify" class="btn-primary">进入</button>
      <p id="invite-msg" class="msg"></p>
    </div>
  </section>

  <!-- 2. 注册 / 登录 -->
  <section id="screen-auth" class="screen">
    <div class="invite-card">
      <div class="invite-seal">🪷</div>
      <h1 id="auth-title">注册</h1>
      <p class="invite-sub" id="auth-sub">推荐码验证通过，请注册账号</p>
      <div class="filter-row" style="justify-content:center">
        <button class="chip active" id="chip-mode-register">注册</button>
        <button class="chip" id="chip-mode-login">登录</button>
      </div>
      <div class="filter-row" style="justify-content:center;margin-top:8px">
        <button class="chip active" id="chip-type-phone">手机</button>
        <button class="chip" id="chip-type-email">邮箱</button>
      </div>
      <input id="auth-account" class="invite-input" placeholder="手机号" inputmode="tel" autocomplete="tel">
      <div id="auth-code-row" class="code-row">
        <input id="auth-code" class="invite-input" placeholder="验证码" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
        <button id="btn-auth-send-code">发送验证码</button>
      </div>
      <input id="auth-password" class="invite-input" type="password" placeholder="密码（至少 6 位）" autocomplete="current-password">
      <button id="btn-auth-submit" class="btn-primary">注册</button>
      <p id="auth-msg" class="msg"></p>
      <button id="btn-auth-reinvite" class="btn-ghost">重新输入推荐码</button>
    </div>
  </section>

  <!-- 3. 经文库列表 -->
  <section id="screen-library" class="screen">
    <header class="topbar"><h2>经文库</h2></header>
    <div class="filter-row">
      <button class="chip active" data-trad="all">全部</button>
      <button class="chip" data-trad="buddhist">佛经</button>
      <button class="chip" data-trad="taoist">道经</button>
    </div>
    <ul id="sutra-list" class="sutra-list"></ul>
  </section>

  <!-- 3. 字体选择 -->
  <section id="screen-font" class="screen">
    <header class="topbar">
      <button id="btn-back-lib2" class="btn-ghost">‹ 返回</button>
      <h2>选择字体</h2>
      <span class="topbar-spacer"></span>
    </header>
    <p class="picker-hint">临摹字将以所选字体虚化显示</p>
    <div id="font-cards" class="pick-cards"></div>
    <div class="picker-foot">
      <button id="btn-start-copy" class="btn-primary btn-big">开始抄经</button>
    </div>
  </section>

  <!-- 4. 全屏抄写 -->
  <section id="screen-write" class="screen">
    <canvas id="paper-canvas"></canvas>
    <canvas id="ink-canvas"></canvas>

    <!-- 开场：经名 2 秒 / 段落慢读高亮 -->
    <div id="intro-overlay" class="hidden">
      <div id="intro-title"></div>
      <div id="intro-para"></div>
    </div>

    <!-- 选笔（首次） -->
    <div id="pen-picker" class="picker-overlay hidden">
      <div class="picker-card">
        <h3>选择笔</h3>
        <div id="pen-cards" class="pick-cards"></div>
        <button id="btn-pen-done" class="btn-primary btn-big">开始书写</button>
      </div>
    </div>

    <!-- 换字体（工具内） -->
    <div id="font-overlay" class="picker-overlay hidden">
      <div class="picker-card">
        <h3>选择字体</h3>
        <div id="font-cards-2" class="pick-cards"></div>
        <button id="btn-font-done" class="btn-primary btn-big">确定</button>
      </div>
    </div>

    <!-- 左下角：工具 + 橡皮 -->
    <div id="write-ui">
      <button id="btn-tools" class="fab" aria-label="工具">☰</button>
      <button id="btn-eraser" class="fab" aria-label="橡皮擦">🧽</button>
    </div>

    <!-- 工具菜单：散布全屏 -->
    <div id="tools-menu" class="hidden">
      <button class="tool-item" data-tool="sutra">经文</button>
      <button class="tool-item" data-tool="font">字体</button>
      <button class="tool-item" data-tool="pen">笔</button>
      <button class="tool-item" data-tool="music">背景音</button>
      <button class="tool-item" data-tool="view">欣赏</button>
      <button class="tool-item" data-tool="share">分享</button>
    </div>

    <!-- 写完一字的过渡按钮 -->
    <button id="btn-keep-editing" class="pill hidden">继续改写</button>
    <button id="btn-force-next" class="pill hidden">写好了 →</button>

    <!-- 全部写完 -->
    <div id="done-overlay" class="picker-overlay hidden">
      <div class="picker-card">
        <div class="done-seal">🪷</div>
        <h3>全部写完</h3>
        <p id="done-summary" class="picker-hint"></p>
        <div class="done-actions">
          <button id="btn-done-view" class="btn-primary">欣赏作品</button>
          <button id="btn-done-pdf" class="btn-secondary">生成 PDF</button>
          <button id="btn-done-share" class="btn-secondary">分享</button>
          <button id="btn-done-lib" class="btn-ghost">返回经文库</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 5. 欣赏作品 -->
  <section id="screen-appreciate" class="screen">
    <header class="topbar">
      <button id="btn-back-write" class="btn-ghost">‹ 返回</button>
      <h2>欣赏</h2>
      <span class="topbar-spacer"></span>
    </header>
    <div id="work-head">
      <h3 id="work-title"></h3>
      <p id="work-meta"></p>
    </div>
    <div id="work-sheet"></div>
    <div class="picker-foot">
      <button id="btn-work-pdf" class="btn-primary">生成 PDF</button>
      <button id="btn-work-share" class="btn-secondary">分享</button>
    </div>
  </section>

</div>

<!-- 打印专用：屏幕上隐藏，打印时显示 -->
<div id="print-sheet"></div>

<script src="music.js"></script>
<script src="writing.js"></script>
<script src="app.js"></script>
</body>
</html>
